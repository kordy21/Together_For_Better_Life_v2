<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" sizes="32x32" href="../assets/images//logo maan l hayat afdal.svg" type="image/png">
    <link rel="icon" sizes="16x16" href="../assets/images//logo maan l hayat afdal.svg" type="image/png">

    <title>complete-donation - Together for Better Life</title>

  <body>
    <!-- Navbar will be included here -->
  <div id="nav-en"></div>

    <main class="container-fluid px-0">
  <div id="nav-en"></div>

      <!-- Form Section-->
      <div
        class="d-flex justify-content-center align-items-center m-sm-5 m-md-none"
        style="min-height: 100vh"
      >
        <div id="overlay" class="overlay d-none"></div>
        <div id="form-container" class="form-container">
          <div class="text-center">
            <img
              src="./../assets/images/Vector.svg"
              alt="vector"
              style="width: 40px; height: 30px; margin-top: 20px"
            />
            <h1
              class="display-1 display-md-3 fs-2"
              style="color: #ef7d07; font-size: 50px"
            >
              Donate via Online Payment
            </h1>
            <p class="display-1 display-md-3 fs-2 pb-4 sub"></p>
          </div>
          <!-- Donation Information Section -->
          <div class="row mb-3"></div>
        <!-- Personal Information Section -->
        <h2 class="form-section-title" style="text-align: left;">Donation Information</h2>
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="firstName" class="form-label">
              First Name <span style="color:red">*</span>
            </label>
            <input
              type="text"
              class="Hover"
              id="firstName"
              placeholder="Enter first name"
              required
            />
          </div>
          <div class="col-md-6">
            <label for="lastName" class="form-label">
              Last Name <span style="color:red">*</span>
            </label>
            <input
              type="text"
              class="Hover"
              id="lastName"
              placeholder="Enter last name"
              required
            />
  </div>
</div>

<div class="row mb-3">
  <div class="col-md-6">
    <label for="country" class="form-label">
      Country <span style="color:red">*</span>
    </label>
    <select
      class="form-select"
      id="country"
      style="font-size: 10px; direction: rtl; text-align: letf"
      required
    >
      <option selected disabled value="">Select Country</option>
<option value="+20">+20 (Egypt)</option>
<option value="+212">+212 (Morocco)</option>
<option value="+213">+213 (Algeria)</option>

<option value="+224">+224 (Guinea)</option>
<option value="+225">+225 (Côte d'Ivoire)</option>
<option value="+226">+226 (Burkina Faso)</option>
<option value="+227">+227 (Niger)</option>
<option value="+228">+228 (Togo)</option>
<option value="+229">+229 (Benin)</option>
<option value="+230">+230 (Mauritius)</option>
<option value="+231">+231 (Liberia)</option>
<option value="+232">+232 (Sierra Leone)</option>
<option value="+233">+233 (Ghana)</option>
<option value="+234">+234 (Nigeria)</option>
<option value="+235">+235 (Chad)</option>
<option value="+236">+236 (Central African Republic)</option>
<option value="+237">+237 (Cameroon)</option>
<option value="+238">+238 (Cape Verde)</option>
<option value="+239">+239 (Sao Tome & Principe)</option>
<option value="+240">+240 (Equatorial Guinea)</option>
<option value="+241">+241 (Gabon)</option>
<option value="+242">+242 (Republic of the Congo)</option>
<option value="+243">+243 (DR Congo)</option>
<option value="+244">+244 (Angola)</option>
<option value="+245">+245 (Guinea-Bissau)</option>
<option value="+246">+246 (British Indian Ocean Territory)</option>
<option value="+247">+247 (Ascension Island)</option>
<option value="+248">+248 (Seychelles)</option>
<option value="+249">+249 (Sudan)</option>
<option value="+250">+250 (Rwanda)</option>
<option value="+251">+251 (Ethiopia)</option>
<option value="+252">+252 (Somalia)</option>
<option value="+253">+253 (Djibouti)</option>
<option value="+254">+254 (Kenya)</option>
<option value="+255">+255 (Tanzania)</option>
<option value="+256">+256 (Uganda)</option>
<option value="+257">+257 (Burundi)</option>
<option value="+258">+258 (Mozambique)</option>
<option value="+260">+260 (Zambia)</option>
<option value="+261">+261 (Madagascar)</option>
<option value="+262">+262 (Réunion)</option>
<option value="+263">+263 (Zimbabwe)</option>
<option value="+264">+264 (Namibia)</option>
      ...
    </select>
  </div>

  <div class="col-md-6">
    <label for="phoneNumber" class="form-label">
      Phone Number <span style="color:red">*</span>
    </label>
    <div class="input-group">
      <input
        type="tel"
        class="form-control Hover"
        id="phoneNumberInput"
        placeholder="Phone number"
        pattern="[0-9]{6,15}"
        required
      />
      <select
        class="form-select"
        id="countrySelect"
        style="max-width: 130px"
        required
      >
<option value="+20">+20 (Egypt)</option>
<option value="+966">+966 (Saudi Arabia)</option>
<option value="+971">+971 (United Arab Emirates)</option>
<option value="+962">+962 (Jordan)</option>
<option value="+963">+963 (Syria)</option>
<option value="+965">+965 (Kuwait)</option>
<option value="+968">+968 (Oman)</option>
<option value="+973">+973 (Bahrain)</option>
<option value="+974">+974 (Qatar)</option>
<option value="+218">+218 (Libya)</option>
<option value="+212">+212 (Morocco)</option>
<option value="+213">+213 (Algeria)</option>
<option value="+216">+216 (Tunisia)</option>
<option value="+249">+249 (Sudan)</option>
<option value="+967">+967 (Yemen)</option>

        ...
      </select>
    </div>
  </div>
</div>

<div class="row mb-4">
  <div class="col-md-6">
    <label for="email" class="form-label">
      Email <span style="color:red">*</span>
    </label>
    <input
      type="email"
      class="Hover"
      id="email"
      placeholder="Email"
      required
    />
  </div>
  <div class="col-md-6">
    <label for="address" class="form-label">
      Address (Optional)
    </label>
    <input
      type="text"
      class="Hover"
      id="address"
      placeholder="Optional address"
    />
  </div>
</div>


          <!-- Payment Method Section -->
<h2 class="form-section-title" style="text-align: left;">Payment Method</h2>
<div class="row payment-methods gx-2 gy-2">
  <div class="col-4 col-md-5 col-lg-2">
    <div class="payment-option text-center p-2 border rounded">
      <img src="./../assets/images/miza.svg" alt="miza" class="img-fluid" />
      <div class="d-flex justify-content-center mt-2">
        <input type="radio" name="payment" class="square-radio" />
      </div>
    </div>
  </div>
  <div class="col-4 col-md-5 col-lg-2">
    <div class="payment-option text-center p-2 border rounded">
      <img src="./../assets/images/visa.svg" alt="visa" class="img-fluid" />
      <div class="d-flex justify-content-center mt-2">
        <input type="radio" name="payment" class="square-radio" />
      </div>
    </div>
  </div>
  <div class="col-4 col-md-5 col-lg-2">
    <div class="payment-option text-center p-2 border rounded">
      <img src="./../assets/images/mastercard.svg" alt="mastercard" class="img-fluid" />
      <div class="d-flex justify-content-center mt-2">
        <input type="radio" name="payment" class="square-radio" />
      </div>
    </div>
  </div>
  <div class="col-4 col-md-5 col-lg-2">
    <div class="payment-option text-center p-2 border rounded">
      <img src="./../assets/images/ALbankalahly.svg" alt="albankalahly" class="img-fluid" />
      <div class="d-flex justify-content-center mt-2">
        <input type="radio" name="payment" class="square-radio" />
      </div>
    </div>
  </div>
</div>


          <a
            href="#"
            id="openPopupBtn"
            class="text-decoration-none d-flex justify-content-center align-items-center"
          >
<form id="donationForm">


  <button
    type="submit"
    id="submitBtn"
    class="py-2 px-3 btn-main-custom-blue d-flex align-items-center gap-2"
    disabled
  >
    <span>Proceed to Payment</span>
    <img src="./../assets/images/Group (4).svg" alt="icon" />
  </button>
</form>

          </a>
        </div>
      </div>

      <!--Bobbab Form  -->
      <div
        class="d-flex justify-content-center align-items-center m-5"
        style=""
      >
        <div id="formContainer" class="form-container-pop d-none">
          <div class="form-header">
            <img
              src="./../assets/images/Vector.svg"
              alt="vector"
              style="width: 40px height 30px; margin-top: 20px"
              ;
            />
            <h3 style="color: #ef7d07">EGP 20.00</h3>
          </div>

          <form style="width: 100% !important;">
            <div class="row">
              <div class="col-md-6">
                <div class="form-group">
                  <label for="cardNumber" class="form-label-pop"
                    >Credit/Debit Card Number</label
                  >
                  <input
                    type="text"
                    class="Hover"
                    id="cardNumber"
                    placeholder="****************"
                    required
                  />
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group">
                  <label for="cardHolderName" class="form-label-pop"
                    >Cardholder Name</label
                  >
                  <input
                    type="text"
                    class="Hover"
                    id="cardHolderName"
                    placeholder="Last name"
                    required
                  />
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6">
                <div class="form-group">
                  <label for="expiryMonth" class="form-label-pop"
                    >Expiry Month</label
                  >
                  <input
                    type="text"
                    class="Hover"
                    id="expiryMonth"
                    placeholder="MM"
                    maxlength="2"
                    required
                  />
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group">
                  <label for="expiryYear" class="form-label-pop"
                    >Expiry Year</label
                  >
                  <input
                    type="text"
                    class="Hover"
                    id="expiryYear"
                    placeholder="YY"
                    maxlength="2"
                    required
                  />
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6">
                <div class="form-group">
                  <label for="securityCode" class="form-label-pop"
                    >Card Security Code</label
                  >
                  <input
                    type="text"
                    class="Hover"
                    id="securityCode"
                    placeholder="123"
                    maxlength="4"
                    required
                  />
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group">
                  <label for="cardSource" class="form-label-pop"
                    >Is the card issued from Egypt?</label
                  >
                  <select class="form-select" id="cardSource" required>
                    <option value="">Yes</option>
                    <option value="no">No</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="d-flex justify-content-center align-items-center mt-4">
              <button
                id="donateBtn"
                class="py-2 px-4 btn-main-custom-blue d-flex align-items-center gap-2 border-0"
              >
                <span>Donate Now</span>
                <img src="./../assets/images/Group (4).svg" alt="icon" />
              </button>
            </div>
          </form>
        </div>
      </div>


    </main>

    <!-- Footer will be included here -->
  <div id="footer-en"></div>

  </body>
</html>
