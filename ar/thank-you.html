<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" sizes="32x32" href="../assets/images/logo maan l hayat afdal.svg" type="image/png">
  <link rel="icon" sizes="16x16" href="../assets/images/logo maan l hayat afdal.svg" type="image/png">
  <link rel="apple-touch-icon" href="../assets/images/logo maan l hayat afdal.svg">
  <title>شكراً - تم الدفع بنجاح</title>

  <!-- Bootstrap & FontAwesome -->
  <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../node_modules/@fortawesome/fontawesome-free/css/all.min.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../assets/css/style.css"/>
  <link rel="stylesheet" href="../assets/css/lastnews.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet" />

  <style>
    body {
      background-color: #f3f4f6;
      font-family: 'Cairo', sans-serif;
    }
    .thankyou-container {
      min-height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .thankyou-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 32px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      animation: fadeInUp 0.8s ease forwards;
    }
    .thankyou-icon {
      font-size: 64px;
      color: #ef7d07;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeInUp 0.8s ease forwards;
      animation-delay: 0.1s;
    }
    .thankyou-card h1 {
      font-size: 26px;
      font-weight: 800;
      color: #1f2937;
      margin-bottom: 12px;
      opacity: 0;
      animation: fadeInUp 0.8s ease forwards;
      animation-delay: 0.3s;
    }
    .thankyou-card p {
      color: #6b7280;
      font-size: 16px;
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeInUp 0.8s ease forwards;
      animation-delay: 0.5s;
    }
    .thankyou-card .btn {
      background: #ef7d07;
      color: #fff;
      font-weight: 600;
      border-radius: 8px;
      padding: 12px 24px;
      text-decoration: none;
      transition: background 0.3s;
      opacity: 0;
      animation: fadeInUp 0.8s ease forwards;
      animation-delay: 0.7s;
    }
    .thankyou-card .btn:hover {
      background: #d66c05;
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
      <div id="navbar-placeholder"></div>

  <!-- Thank You Section -->
  <div class="thankyou-container">
    <div class="thankyou-card">
      <i class="fas fa-check-circle thankyou-icon"></i>
      <h1>شكراً لك!</h1>
      <p>تم إتمام عملية الدفع بنجاح.</p>
      <a href="index.html" class="btn">العودة للرئيسية</a>
    </div>
  </div>

  <!-- Footer -->
    <div id="footer-placeholder"></div>

  <!-- JS Scripts -->
  <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
